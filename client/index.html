<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stickman Golf 2D</title>
    <!-- Empty inline icon. Suppresses the /favicon.ico 404 so the console stays clean for runs. -->
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0e11;
        color: #e8edf2;
        font: 14px/1.5 system-ui, sans-serif;
      }

      /*
        The Renderer frames the whole Playfield inside whatever box it is given and shows the surplus as
        the outside-Playfield fill (R14.3), so this box does not have to match the Playfield aspect ratio.
        It is given the Playfield ratio anyway, because surplus is wasted screen rather than a feature.
      */
      #playfield-root {
        display: block;
        width: 100%;
        aspect-ratio: 1000 / 600;
        max-height: 72vh;
      }

      #playfield-root canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /*
        Debug_Overlay layout. R9.15 requires each value element's text content to be the value alone, so
        every caption is a sibling element rather than part of the value. The styling below is what makes
        that arrangement readable to a human without putting a single character inside a value element.
      */
      #overlay-root {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 4px 18px;
        align-items: start;
        padding: 14px 16px 20px;
        font-variant-numeric: tabular-nums;
      }

      .overlay-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .overlay-group h2 {
        margin: 0 0 4px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #7d8b98;
      }

      .overlay-field {
        display: flex;
        gap: 10px;
        align-items: baseline;
        justify-content: space-between;
        min-height: 22px;
      }

      .overlay-label {
        color: #8b99a6;
        white-space: nowrap;
      }

      .overlay-value {
        color: #e8edf2;
        font-weight: 600;
        text-align: right;
        overflow-wrap: anywhere;
      }

      .overlay-input {
        width: 7ch;
        padding: 3px 6px;
        border: 1px solid #3a4650;
        border-radius: 4px;
        background: #171d23;
        color: inherit;
        font: inherit;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .overlay-input:focus-visible {
        outline: 2px solid #ffb703;
        outline-offset: 1px;
      }
    </style>
  </head>
  <body>
    <!--
      R9.1 - the Debug_Overlay renders as DOM outside the rendering canvas and is present from the
      first rendered frame with no query parameter, keypress or configuration flag required. Both
      roots below are populated by the client; the overlay is built in task 10 and the canvas is
      attached by the Renderer in task 8.
    -->
    <div id="playfield-root"></div>
    <div id="overlay-root"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
